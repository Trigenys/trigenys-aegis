# Labo de démonstration de l'offre d'informatique gérée pour PME.
#
# Adapté des Compose officiels, aux versions épinglées ci-dessous :
#   - Wazuh      : wazuh/wazuh-docker, tag v4.14.10, single-node/docker-compose.yml
#                  et single-node/generate-indexer-certs.yml
#   - MeshCentral: Ylianst/MeshCentral, tag 1.3.1, docker/compose.yaml
#   - GLPI       : glpi-project/docker-images, docker-compose.example.yml
#
# Écarts volontaires par rapport aux fichiers officiels :
#   - secrets lus depuis .env (jamais en clair ici) ;
#   - limites mémoire sur chaque service ;
#   - indexer et API Wazuh liés à 127.0.0.1, ports des consoles configurables ;
#   - MariaDB épinglée à la place de l'image « mysql » non versionnée ;
#   - MeshCentral en variante « slim » (base NeDB locale, pas de MongoDB).
#
# Préparer avant le premier démarrage : ./setup.sh (voir README.md).
# Usage commercial : voir LICENSES.md.

name: aegis-lab

x-restart: &restart
  restart: unless-stopped

services:
  # --- Wazuh : SIEM / XDR -------------------------------------------------
  wazuh.manager:
    <<: *restart
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.14.10}
    hostname: wazuh.manager
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    ports:
      - "${WAZUH_AGENT_PORT:-1514}:1514"         # événements des agents
      - "${WAZUH_ENROLL_PORT:-1515}:1515"        # enrôlement des agents
      - "${WAZUH_SYSLOG_PORT:-514}:514/udp"      # syslog (OPNsense)
      - "127.0.0.1:${WAZUH_API_PORT:-55000}:55000"
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:?à définir dans .env}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:?à définir dans .env}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
    depends_on:
      - wazuh.indexer
    deploy:
      resources:
        limits: { memory: "${WAZUH_MANAGER_MEM:-1g}" }

  wazuh.indexer:
    <<: *restart
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.10}
    hostname: wazuh.indexer
    ports:
      - "127.0.0.1:${WAZUH_INDEXER_PORT:-9200}:9200"
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms${WAZUH_INDEXER_HEAP:-1g} -Xmx${WAZUH_INDEXER_HEAP:-1g}"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    deploy:
      resources:
        # Le tas Java (WAZUH_INDEXER_HEAP) doit rester à environ la moitié de cette limite.
        limits: { memory: "${WAZUH_INDEXER_MEM:-2g}" }

  wazuh.dashboard:
    <<: *restart
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.10}
    hostname: wazuh.dashboard
    ports:
      - "${CONSOLE_BIND:-127.0.0.1}:${WAZUH_DASHBOARD_PORT:-8443}:5601"
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:?à définir dans .env}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD:?à définir dans .env}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:?à définir dans .env}
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    deploy:
      resources:
        limits: { memory: "${WAZUH_DASHBOARD_MEM:-1g}" }

  # Générateur de certificats officiel Wazuh, lancé une fois par setup.sh.
  wazuh.certs:
    image: wazuh/wazuh-certs-generator:${WAZUH_CERTS_GENERATOR_VERSION:-0.0.5}
    hostname: wazuh-certs-generator
    profiles: ["setup"]
    environment:
      CERT_TOOL_VERSION: ${WAZUH_CERT_TOOL_VERSION:-4.14}
      CERT_TOOL_REPOSITORY: prod
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/:/certificates/
      - ./wazuh/config/certs.yml:/config/certs.yml:ro
    deploy:
      resources:
        limits: { memory: 256m }

  # --- MeshCentral : prise en main et gestion des postes ------------------
  meshcentral:
    <<: *restart
    image: ghcr.io/ylianst/meshcentral:${MESHCENTRAL_VERSION:-1.3.1}-slim
    environment:
      # La configuration est réappliquée depuis .env à chaque démarrage (labo déclaratif).
      DYNAMIC_CONFIG: "true"
      HOSTNAME: ${LAB_HOSTNAME:?à définir dans .env}
      PORT: "443"
      REDIR_PORT: "80"
      ALLOW_NEW_ACCOUNTS: "false"   # seul le premier compte (administrateur) peut être créé
      ALLOW_PLUGINS: "false"
      WEBRTC: "false"
      LOCAL_SESSION_RECORDING: "true"
      USE_MONGODB: "false"
    ports:
      - "${MESHCENTRAL_HTTPS_PORT:-443}:443"
      - "${MESHCENTRAL_HTTP_PORT:-80}:80"
    volumes:
      - meshcentral-data:/opt/meshcentral/meshcentral-data
      - meshcentral-files:/opt/meshcentral/meshcentral-files
      - meshcentral-web:/opt/meshcentral/meshcentral-web
      - meshcentral-backups:/opt/meshcentral/meshcentral-backups
    deploy:
      resources:
        limits: { memory: "${MESHCENTRAL_MEM:-512m}" }

  # --- GLPI : inventaire, parc et assistance --------------------------------
  glpi:
    <<: *restart
    image: glpi/glpi:${GLPI_VERSION:-12.0.2}
    environment:
      GLPI_DB_HOST: glpi-db
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpi}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?à définir dans .env}
      TZ: ${LAB_TIMEZONE:-UTC}
    ports:
      - "${CONSOLE_BIND:-127.0.0.1}:${GLPI_HTTP_PORT:-8080}:80"
    volumes:
      - glpi_data:/var/glpi
    depends_on:
      glpi-db:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: "${GLPI_MEM:-512m}" }

  glpi-db:
    <<: *restart
    image: mariadb:${MARIADB_VERSION:-11.8.9}
    environment:
      MARIADB_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD:?à définir dans .env}
      MARIADB_DATABASE: ${GLPI_DB_NAME:-glpi}
      MARIADB_USER: ${GLPI_DB_USER:-glpi}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:?à définir dans .env}
      TZ: ${LAB_TIMEZONE:-UTC}
    volumes:
      - glpi_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { memory: "${GLPI_DB_MEM:-768m}" }

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  meshcentral-data:
  meshcentral-files:
  meshcentral-web:
  meshcentral-backups:
  glpi_data:
  glpi_db_data:
