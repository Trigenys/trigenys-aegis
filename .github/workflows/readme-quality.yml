name: Product README Quality

on:
  pull_request:
    paths:
      - 'README.md'
      - '.appfactory/readme-contract.json'
      - 'docs/**'
      - '.github/workflows/readme-quality.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.appfactory/readme-contract.json'
      - 'docs/**'
      - '.github/workflows/readme-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-readme:
    uses: Trigenys/appfactory/.github/workflows/reusable-readme-quality.yml@b871fa0888d89a9f755b473ba973cfcf21331a2a
    with:
      manifest_path: .appfactory/readme-contract.json
      readme_path: README.md
      appfactory_ref: b871fa0888d89a9f755b473ba973cfcf21331a2a
